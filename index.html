<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four-Brand Content Desk</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<header class="topbar">
  <div class="brandmark">
    <img class="logo-img" src="icons/icon-192.png" alt="" width="40" height="40">
    <div><div class="app-title">Four-Brand Content Desk</div><div class="app-sub" id="monthLabel">—</div></div>
  </div>
  <div class="top-actions">
    <label class="month-pick">Bulan
      <select id="monthSelect" title="Pilih bulan"></select>
    </label>
    <button class="btn ghost" id="installBtn" hidden title="Install dashboard sebagai app desktop">⬇ Install</button>
    <button class="btn ghost" id="addMonthBtn" title="Cipta skeleton bulan baru (localStorage)">+ Tambah bulan</button>
    <button class="btn ghost" id="undoBtn" title="Undo Posted terakhir">↶ Undo</button>
    <button class="btn ghost" id="exportBtn" title="Export semua data desk:* ke .json">Export JSON</button>
    <button class="btn ghost" id="importBtn" title="Import fail .json">Import JSON</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <div class="bell-wrap">
      <button class="bell" id="bellBtn" title="Today's posting">🔔<span class="badge" id="bellBadge" hidden>0</span></button>
      <div class="popup" id="bellPopup" hidden></div>
    </div>
    <button class="btn ghost" id="themeBtn" title="Tukar Light/Dark">☀ Light</button>
  </div>
</header>
<div class="hero-bar" id="heroBar"></div>
<div class="layout">
  <nav class="sidenav">
    <button class="nav-item active" data-view="overview">📊 Overview</button>
    <button class="nav-item" data-view="planner">🗓 Content Planner</button>
    <div class="nav-legend" id="navLegend"></div>
    <div class="nav-foot">Draft sahaja — Michelle approve dulu sebelum post. Tak pasti = <b>UNCONFIRMED</b>.</div>
  </nav>
  <main>
    <section id="view-overview" class="view"></section>
    <section id="view-planner" class="view" hidden></section>
  </main>
</div>
<div class="modal-back" id="modalBack" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<!-- Data bulan: tambah satu baris <script> untuk setiap fail data/YYYY-MM.js baru -->
<script src="data/2026-10.js"></script>
<!-- /Data bulan -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
let deferredInstall; const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall=e; ib.hidden=false; });
ib.addEventListener('click', async () => { if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; ib.hidden=true; });
window.addEventListener('appinstalled', () => { ib.hidden=true; });
</script>
</body>
</html>
